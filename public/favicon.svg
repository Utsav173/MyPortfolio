<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Quiet Luxury Cool Graphite -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    
    <!-- Monogram Gradient: Silver Chrome/Brushed Steel -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f4f4f5" />
      <stop offset="70%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Stencil Cut Mask for Custom Brand Twist -->
    <mask id="stencil-mask">
      <!-- Everything white remains visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <!-- Black diagonal slash cuts out a gap -->
      <path d="M 10,25 L 90,77" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bg-grad)" stroke="#1a1b20" stroke-width="1.5" />
  
  <!-- Custom Geometric Stencil Monogram with dynamic tilt -->
  <g transform="skewX(-6) translate(3, 0)" mask="url(#stencil-mask)">
    <!-- Bold U-Shape -->
    <path d="M 18,26 H 30 V 58 C 30,60.2 31.8,62 34,62 V 26 H 46 V 58 C 46,67 39,74 32,74 C 25,74 18,67 18,58 Z" 
          fill="url(#silver-grad)" />
          
    <!-- Bold K-Shape -->
    <!-- Stem -->
    <path d="M 54,26 H 66 V 74 H 54 Z" 
          fill="url(#silver-grad)" />
    <!-- Upper Arm -->
    <path d="M 66,42 L 82,26 V 38 L 66,54 Z" 
          fill="url(#silver-grad)" />
    <!-- Lower Arm -->
    <path d="M 66,46 L 82,62 V 74 L 66,58 Z" 
          fill="url(#silver-grad)" />
  </g>
</svg>
